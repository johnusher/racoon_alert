<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>h32 · monitor</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel-2:#1b2027; --line:#262d36;
    --txt:#e7ecf2; --dim:#8b97a6; --accent:#4cc2ff; --good:#3ad29f;
    --warn:#ffcc66; --bad:#ff6b6b; --rec:#ff5b5b; --scenery:#6e7681;
    --shadow:0 6px 24px rgba(0,0,0,.45); --r:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:linear-gradient(180deg,#14181d,#101317); border-bottom:1px solid var(--line); z-index:5;
  }
  .brand{font-weight:700; letter-spacing:.5px; font-size:15px}
  .brand b{color:var(--accent)}
  .camname{color:var(--dim); font-size:12.5px}
  .spacer{flex:1}
  .pill{
    display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px;
    background:var(--panel-2); border:1px solid var(--line); font-size:12px; color:var(--dim);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .3s}
  .dot.live{background:var(--good); box-shadow:0 0 8px var(--good)}
  .dot.wait{background:var(--warn)}
  .dot.err{background:var(--bad)}
  .rec{color:var(--rec); font-weight:700; font-size:12px; display:none}
  .rec.on{display:inline-flex; align-items:center; gap:7px}
  .rec .dot{background:var(--rec); box-shadow:0 0 8px var(--rec); animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}

  main{position:relative; flex:1; min-height:0; display:flex}
  .left{position:relative; flex:1; min-width:0; background:#000; overflow:hidden}
  .stage{position:absolute; inset:0; overflow:hidden}
  .zoomer{position:absolute; inset:0; transition:transform .12s ease-out; will-change:transform}
  video-stream{display:block; width:100%; height:100%}
  video-stream video{width:100%; height:100%; object-fit:contain; background:#000}
  video-stream .info{display:none!important}
  /* boxes live in the same box as the video and use its intrinsic coordinates */
  #boxes{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  #boxes rect{fill:none; stroke-width:3; vector-effect:non-scaling-stroke}
  #boxes text{font:600 20px -apple-system,system-ui,sans-serif}
  .b-animal{stroke:#ff5050} .t-animal{fill:#ff5050}
  .b-person{stroke:#3cb4d2} .t-person{fill:#3cb4d2}
  .b-vehicle{stroke:#9aa4b0} .t-vehicle{fill:#9aa4b0}
  .b-scenery{stroke:var(--scenery); stroke-width:1.5; stroke-dasharray:7 5}
  .t-scenery{fill:var(--scenery); font-size:15px; font-weight:400}
  .b-face{stroke:#96e6a1; stroke-width:2} .t-face{fill:#96e6a1}
  .b-face-unknown{stroke:#a8c8f0; stroke-width:2} .t-face-unknown{fill:#a8c8f0}
  .who{color:#96e6a1; font-weight:700}
  .who.unknown{color:#a8c8f0}

  /* no-signal / offline overlay */
  .veil{
    position:absolute; inset:0; z-index:8; display:none; flex-direction:column; gap:9px;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:rgba(8,6,6,.88); backdrop-filter:blur(3px);
  }
  .veil.show{display:flex}
  /* the detector being down does not stop the picture — stay see-through for that one */
  .veil.soft{background:rgba(8,6,6,.5); backdrop-filter:none}
  .veil.soft h2{color:var(--warn)}
  .veil h2{margin:0; font-size:26px; letter-spacing:1.2px; color:var(--bad)}
  .veil p{margin:0; color:var(--dim); font-size:13px; max-width:46ch; line-height:1.6}
  .veil .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#9aa4b0}

  .unmute{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:10px;
    flex-direction:column; background:rgba(4,6,9,.35); cursor:pointer; z-index:6; backdrop-filter:blur(1px);
  }
  .unmute .btn-lg{
    background:var(--accent); color:#04222f; font-weight:700; border:none; padding:14px 22px;
    border-radius:999px; font-size:15px; box-shadow:var(--shadow); cursor:pointer;
  }
  .unmute small{color:#cfe6f2}

  .zbadge{
    position:absolute; top:12px; left:12px; z-index:4; padding:4px 9px; border-radius:8px;
    background:rgba(10,13,17,.7); border:1px solid var(--line); color:var(--dim); font-size:12px;
    font-variant-numeric:tabular-nums; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .zbadge.show{opacity:1}

  .controls{                     /* above the overlays, so they always work */
    position:absolute; left:0; right:0; bottom:0; z-index:9;
    display:flex; align-items:center; gap:8px; padding:12px 14px;
    background:linear-gradient(0deg,rgba(9,11,14,.92),rgba(9,11,14,0)); flex-wrap:wrap;
  }
  .grp{display:flex; align-items:center; gap:6px; background:rgba(20,24,29,.8);
       border:1px solid var(--line); border-radius:10px; padding:5px 6px; backdrop-filter:blur(6px)}
  button.ico, .grp button{
    appearance:none; border:none; background:transparent; color:var(--txt); cursor:pointer;
    width:36px; height:34px; border-radius:8px; font-size:15px; display:inline-flex;
    align-items:center; justify-content:center; transition:background .15s,color .15s;
  }
  .grp button:hover{background:var(--panel-2)}
  .grp button:active{transform:translateY(1px)}
  .grp button.on{color:var(--accent)}
  .grp label{color:var(--dim); font-size:11.5px; padding:0 4px}
  input[type=range]{accent-color:var(--accent); width:84px}
  .segbtn{padding:0 12px; width:auto; font-size:12.5px; color:var(--dim)}
  .segbtn.on{color:var(--accent); background:var(--panel-2)}
  .zlabel{min-width:44px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12.5px}

  aside{
    width:302px; flex:none; border-left:1px solid var(--line); background:var(--panel);
    overflow-y:auto; padding:12px;
  }
  aside h3{margin:4px 0 10px; font-size:12px; letter-spacing:.4px; color:var(--dim); text-transform:uppercase}
  .ev{display:flex; gap:10px; padding:8px; border:1px solid var(--line); border-radius:10px;
      margin-bottom:8px; background:#0f1317}
  .ev img{width:88px; height:50px; object-fit:cover; border-radius:6px; background:#000}
  .ev .m{flex:1; min-width:0}
  .ev .tag{font-weight:700}
  .ev .tag.RACCOON{color:#ffcf6a} .ev .tag.ANIMAL{color:#4cc2ff}
  .ev .tag.PERSON{color:#3ad29f} .ev .tag.TEST{color:#8b97a6}
  .ev .t{color:var(--dim); font-size:11px; overflow:hidden; text-overflow:ellipsis}
  .ev a{color:var(--accent); font-size:12px; text-decoration:none}
  .empty{color:var(--dim); font-size:12px; padding:8px; line-height:1.6}

  .toast{
    position:absolute; left:50%; bottom:74px; transform:translateX(-50%) translateY(10px);
    background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
    padding:9px 15px; border-radius:10px; font-size:13px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:10; max-width:80vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%)}
  @media (max-width:760px){ aside{display:none} .camname{display:none} input[type=range]{width:60px} }
</style>
</head>
<body>
  <header>
    <span class="brand"><b>h32</b> monitor</span>
    <span class="camname">Victure PC530 · AI detector</span>
    <span class="rec" id="rec"><span class="dot"></span>RECORDING</span>
    <span class="spacer"></span>
    <span class="pill"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  </header>

  <main>
    <div class="left" id="left">
      <div class="stage" id="stage">
        <div class="zoomer" id="zoomer">
          <video-stream id="cam"></video-stream>
          <svg id="boxes" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>

      <div class="zbadge" id="zbadge">1.0×</div>

      <div class="unmute" id="unmute">
        <button class="btn-lg">🔊&nbsp; Tap for sound</button>
        <small>video is live · click to enable audio</small>
      </div>

      <div class="veil" id="veil">
        <h2 id="veilTitle">NO CAMERA SIGNAL</h2>
        <p id="veilWhy">The detector is not receiving any video.</p>
        <p class="mono" id="veilWhen"></p>
        <p id="veilHint">Nothing is being detected and no events will fire until the feed returns.</p>
      </div>

      <div class="toast" id="toast"></div>

      <div class="controls">
        <div class="grp">
          <button id="btnMute" class="ico" title="Mute / unmute (m)">🔇</button>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="1" title="Volume">
        </div>
        <div class="grp">
          <button id="zOut" title="Zoom out (-)">－</button>
          <span class="zlabel" id="zlabel">1.0×</span>
          <button id="zIn" title="Zoom in (+)">＋</button>
          <button id="zReset" title="Reset view (0)">⤢</button>
        </div>
        <div class="grp" title="Digital pan (arrow keys when zoomed)">
          <label>PAN</label>
          <button data-pan="0,-1">▲</button>
          <button data-pan="-1,0">◀</button>
          <button data-pan="1,0">▶</button>
          <button data-pan="0,1">▼</button>
        </div>
        <div class="spacer" style="flex:1"></div>
        <div class="grp">
          <button id="segMain" class="segbtn on">1080p</button>
          <button id="segSub" class="segbtn">360p</button>
        </div>
        <div class="grp">
          <button id="btnBoxes" class="ico on" title="Show detection boxes (b)">🔲</button>
          <button id="btnSnap" class="ico" title="Snapshot (s)">📷</button>
          <button id="btnFull" class="ico" title="Fullscreen (f)">⛶</button>
        </div>
      </div>
    </div>

    <aside>
      <h3>Recent events</h3>
      <div id="events"><div class="empty">none yet — watching…</div></div>
    </aside>
  </main>

<script type="module">
import './video-stream.js';

// The detector's data feed. Same host, its own port (go2rtc serves this page).
const API = `${location.protocol}//${location.hostname}:8090`;

const cam = document.getElementById('cam');
const stage = document.getElementById('stage');
const zoomer = document.getElementById('zoomer');
const svg = document.getElementById('boxes');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
const zbadge = document.getElementById('zbadge');
const zlabel = document.getElementById('zlabel');
const toastEl = document.getElementById('toast');
const veil = document.getElementById('veil');

const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsBase = `${wsProto}//${location.host}/api/ws`;
let current = 'camera';

// ---- live stream ----
cam.mode = 'webrtc,mse';
cam.media = 'video,audio';
cam.background = false;
function connect(streamName){
  current = streamName;
  cam.src = `${wsBase}?src=${streamName}`;
  setStatus('wait','connecting…');
}
connect(current);

function setStatus(kind,text){
  dot.className = 'dot ' + (kind==='live'?'live':kind==='err'?'err':'wait');
  statusEl.textContent = text;
}

let videoEl = null;
const findVideo = () => { videoEl = cam.querySelector('video'); return videoEl; };
new MutationObserver(()=>{ if(findVideo()) hookVideo(); }).observe(cam,{childList:true,subtree:true});
function hookVideo(){
  if(!videoEl || videoEl._hooked) return;
  videoEl._hooked = true;
  videoEl.muted = true;
  videoEl.addEventListener('playing', ()=>{ if(online!==false) setStatus('live','live'); layout(); });
  videoEl.addEventListener('loadedmetadata', layout);
  videoEl.addEventListener('waiting', ()=> setStatus('wait','buffering…'));
  videoEl.addEventListener('stalled', ()=> setStatus('wait','stalled…'));
  applyVol();
}

// ---- audio ----
const unmute = document.getElementById('unmute');
const btnMute = document.getElementById('btnMute');
const vol = document.getElementById('vol');
let muted = true;
function applyVol(){
  if(!videoEl) return;
  videoEl.muted = muted;
  videoEl.volume = parseFloat(vol.value);
  btnMute.textContent = muted || videoEl.volume===0 ? '🔇' : '🔊';
  btnMute.classList.toggle('on', !muted);
}
function setMuted(m){ muted = m; applyVol(); if(!m) unmute.style.display='none'; }
unmute.addEventListener('click', ()=> setMuted(false));
btnMute.addEventListener('click', ()=> setMuted(!muted));
vol.addEventListener('input', ()=>{ if(parseFloat(vol.value)>0 && muted) muted=false;
                                    unmute.style.display='none'; applyVol(); });

// ---- digital zoom + pan ----
let z = 1, panX = 0, panY = 0;
const Z_MIN=1, Z_MAX=5, Z_STEP=0.25, PAN_STEP=0.18;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function apply(){
  z = clamp(z, Z_MIN, Z_MAX);
  if(z===1){ panX=panY=0; }
  panX = clamp(panX,-1,1); panY = clamp(panY,-1,1);
  const r = stage.getBoundingClientRect();
  zoomer.style.transform =
    `translate(${panX*(z-1)/2*r.width}px, ${panY*(z-1)/2*r.height}px) scale(${z})`;
  const t = z.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×';
  zlabel.textContent = t; zbadge.textContent = t;
  zbadge.classList.toggle('show', z>1);
}
function zoom(d){ z += d; apply(); }
function pan(dx,dy){
  if(z===1){ toast('Zoom in first to pan'); return; }
  panX+=dx*PAN_STEP; panY+=dy*PAN_STEP; apply();
}
document.getElementById('zIn').onclick    = ()=> zoom(+Z_STEP);
document.getElementById('zOut').onclick   = ()=> zoom(-Z_STEP);
document.getElementById('zReset').onclick = ()=>{ z=1; panX=panY=0; apply(); };
document.querySelectorAll('[data-pan]').forEach(b=>{
  const [x,y]=b.dataset.pan.split(',').map(Number);
  b.onclick=()=>pan(x,y);
});
stage.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY<0?+Z_STEP:-Z_STEP); },
                       {passive:false});
window.addEventListener('resize', ()=>{ apply(); layout(); });

// ---- box overlay ----
// The video is letterboxed inside its element by object-fit:contain. Give the SVG the
// same viewBox as the source frame and the same letterboxing, and box coordinates from
// the detector land exactly on the picture at any window size or zoom level.
let showBoxes = true, srcW = 0, srcH = 0, boxes = [], faceBoxes = [];
function layout(){
  const w = srcW || (videoEl && videoEl.videoWidth) || 0;
  const h = srcH || (videoEl && videoEl.videoHeight) || 0;
  if(w && h) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
function drawBoxes(){
  if(!showBoxes || !svg.getAttribute('viewBox') || (!boxes.length && !faceBoxes.length)){
    svg.innerHTML=''; return;
  }
  const fs = Math.max(12, Math.round((srcW || 1920) / 64));   // label size in frame units
  const parts = boxes.map(b=>{
    const [x1,y1,x2,y2] = b.box;
    const kind = b.scenery ? 'scenery' : b.cls;
    const label = b.scenery ? `${b.cls} ${b.conf} · scenery` : `${b.cls} ${b.conf}`;
    return `<rect class="b-${kind}" x="${x1}" y="${y1}" width="${Math.max(0,x2-x1)}" height="${Math.max(0,y2-y1)}" rx="3"/>`
         + `<text class="t-${kind}" font-size="${b.scenery?fs*0.8:fs}" x="${x1+3}" y="${Math.max(fs,y1-fs*0.35)}">${label}</text>`;
  });
  for(const f of faceBoxes){
    const [x1,y1,x2,y2] = f.box;
    const kind = f.who ? 'face' : 'face-unknown';
    parts.push(`<rect class="b-${kind}" x="${x1}" y="${y1}" width="${Math.max(0,x2-x1)}" height="${Math.max(0,y2-y1)}" rx="2"/>`
      + `<text class="t-${kind}" font-size="${fs*0.8}" x="${x1}" y="${Math.max(fs,y1-fs*0.3)}">${f.who||'?'} ${f.score}</text>`);
  }
  svg.innerHTML = parts.join('');
}
const btnBoxes = document.getElementById('btnBoxes');
btnBoxes.onclick = ()=>{
  showBoxes = !showBoxes;
  btnBoxes.classList.toggle('on', showBoxes);
  drawBoxes();
  toast(showBoxes ? 'Detection boxes on' : 'Detection boxes off');
};

// ---- detector feed ----
let online = null;
async function poll(){
  let d;
  try{
    d = await (await fetch(`${API}/state.json`,{cache:'no-store'})).json();
  }catch(e){
    online = null;
    setStatus('err','detector offline');
    showVeil('DETECTOR NOT RUNNING',
             'The camera stream is still live, but nothing is watching it for animals.',
             'h32 detect', 'No snapshots, clips or alerts are being produced.', true);
    boxes = []; faceBoxes = []; drawBoxes();
    return;
  }
  online = !!d.online;
  srcW = d.frame_w || srcW; srcH = d.frame_h || srcH;
  layout();
  boxes = d.boxes || []; faceBoxes = d.faces || []; drawBoxes();
  document.getElementById('rec').classList.toggle('on', !!d.recording);

  if(online){
    hideVeil();
    setStatus(videoEl && !videoEl.paused ? 'live' : 'wait', d.status || 'live');
  }else{
    setStatus('err','no camera signal');
    showVeil('NO CAMERA SIGNAL',
             d.signal || 'The detector is not receiving any video from the camera.',
             d.last_frame ? `last frame ${new Date(d.last_frame*1000).toLocaleTimeString()}`
                          + `  ·  ${Math.round(Date.now()/1000 - d.last_frame)}s ago`
                          : 'no video has arrived since the detector started',
             'Nothing is being detected and no events will fire until the feed returns.');
  }
  renderEvents(d.events || []);
}
function showVeil(title, why, when, hint, soft=false){
  document.getElementById('veilTitle').textContent = title;
  document.getElementById('veilWhy').textContent = why;
  document.getElementById('veilWhen').textContent = when;
  document.getElementById('veilHint').textContent = hint;
  veil.classList.toggle('soft', soft);
  veil.classList.add('show');
}
function hideVeil(){ veil.classList.remove('show'); }

function renderEvents(list){
  const box = document.getElementById('events');
  if(!list.length){ box.innerHTML='<div class="empty">none yet — watching…</div>'; return; }
  box.innerHTML = list.map(e=>`<div class="ev">
    <img src="${API}/file/${e.snapshot}" onerror="this.style.visibility='hidden'">
    <div class="m"><div class="tag ${e.tag}">${e.tag}${
      e.who!==undefined && e.tag==='PERSON'
        ? ` <span class="who${e.who?'':' unknown'}">${e.who||'unknown'}</span>` : ''}</div>
    <div class="t">${e.time} · ${e.detail||''}</div>
    ${e.clip?`<a href="${API}/file/${e.clip}" target="_blank">▶ clip</a>`:''}</div></div>`).join('');
}
poll(); setInterval(poll, 1000);

// ---- snapshot ----
// Draws the video frame, then the same boxes on top, so the saved PNG matches the screen.
function snapshot(){
  const v = findVideo();
  if(!v || !v.videoWidth){ toast('No frame yet'); return; }
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(v,0,0);
  if(showBoxes){
    ctx.lineWidth = 3; ctx.font = '600 20px system-ui, sans-serif';
    for(const b of boxes){
      const [x1,y1,x2,y2] = b.box;
      const col = b.scenery ? '#6e7681'
                : b.cls==='animal' ? '#ff5050' : b.cls==='person' ? '#3cb4d2' : '#9aa4b0';
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.setLineDash(b.scenery ? [7,5] : []);
      ctx.strokeRect(x1, y1, x2-x1, y2-y1);
      ctx.fillText(`${b.cls} ${b.conf}${b.scenery?' · scenery':''}`, x1+3, Math.max(18,y1-7));
    }
  }
  c.toBlob(b=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `h32-monitor-${new Date().toISOString().replace(/[:T]/g,'-').slice(0,19)}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('📷 Snapshot saved');
  },'image/png');
}
document.getElementById('btnSnap').onclick = snapshot;

// ---- fullscreen / stream switch ----
document.getElementById('btnFull').onclick = ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.getElementById('left').requestFullscreen?.();
};
const segMain=document.getElementById('segMain'), segSub=document.getElementById('segSub');
segMain.onclick=()=>{ if(current==='camera')return;
  segMain.classList.add('on'); segSub.classList.remove('on'); connect('camera'); };
segSub.onclick =()=>{ if(current==='camera_sub')return;
  segSub.classList.add('on'); segMain.classList.remove('on'); connect('camera_sub'); };

// ---- toast ----
let toastT;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1900);
}

// ---- keyboard (same bindings as the plain viewer) ----
window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  switch(e.key){
    case 'ArrowUp':    pan(0,-1); e.preventDefault(); break;
    case 'ArrowDown':  pan(0, 1); e.preventDefault(); break;
    case 'ArrowLeft':  pan(-1,0); e.preventDefault(); break;
    case 'ArrowRight': pan( 1,0); e.preventDefault(); break;
    case '+': case '=': zoom(+Z_STEP); break;
    case '-': case '_': zoom(-Z_STEP); break;
    case '0': z=1; panX=panY=0; apply(); break;
    case 'f': document.getElementById('btnFull').click(); break;
    case 'b': btnBoxes.click(); break;
    case 'm': setMuted(!muted); break;
    case 's': snapshot(); break;
  }
});

apply();
</script>
</body>
</html>
